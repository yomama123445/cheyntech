name: ci
on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: cheyntech_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_pw"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: cheyntech_test
      DB_USER: root
      DB_PASS: ci_root_pw
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: Create test config (no secrets)
        run: |
          cat << 'EOF' > config/database.php
          <?php
          declare(strict_types=1);
          $db_host = getenv('DB_HOST') ?: '127.0.0.1';
          $db_name = getenv('DB_NAME') ?: 'cheyntech_test';
          $db_user = getenv('DB_USER') ?: 'root';
          $db_pass = getenv('DB_PASS') ?: 'ci_root_pw';
          try {
              $pdo = new PDO("mysql:host={$db_host};dbname={$db_name};charset=utf8mb4", $db_user, $db_pass, [
                  PDO::ATTR_ERRMODE            => PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                  PDO::ATTR_EMULATE_PREPARES   => false,
                  PDO::ATTR_TIMEOUT            => 3,
              ]);
          } catch (PDOException $e) {
              http_response_code(500);
              exit;
          }
          EOF
      - name: Load schema into test database
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_pw cheyntech_test < database/schema.sql
          for f in database/migrations/*.sql; do [ -e "$f" ] && mysql -h 127.0.0.1 -uroot -pci_root_pw cheyntech_test < "$f"; done || true
      - name: Smoke tests
        run: bash tests/smoke.sh
