# CheynTech Nginx configuration snippet for HestiaCP
# Add to the server {} block or web domain Nginx template

# Security Headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Deny web access to sensitive directories (config, database, docs, wireframes)
location ~* ^/(config|database|docs|wireframes)/ {
    deny all;
    return 404;
}

# Deny web access to sensitive file types
location ~* \.(md|xml|sql|env|log|example)$ {
    deny all;
    return 404;
}

# Specifically deny direct access to config files
location = /config/database.php {
    deny all;
    return 404;
}
